<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ManaCadeo Apartment</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h2>🏢 ManaCadeo Apartment</h2>
  <p>Apartment Management System</p>
</header>

<main>

  <!-- HOME / DASHBOARD -->
  <section id="view-dashboard" class="view">
    <div class="card">
      <h3>Dashboard <span id="dashMonth" class="muted"></span></h3>
      <div id="dashTiles">Loading...</div>
    </div>
  </section>

  <!-- SUBMIT PAYMENT -->
  <section id="view-pay" class="view">
    <div class="card">
      <h3>Submit Payment</h3>

      <label>Flat</label>
      <select id="flat" onchange="loadBalance()"><option>Loading...</option></select>

      <div id="summary" class="summary">Select a flat to see its balance</div>

      <label>Pay for</label>
      <select id="payFor" onchange="onPayFor()"></select>
      <select id="extraGroup" onchange="onPayFor()" style="display:none"></select>
      <div id="payTo" class="preview"></div>

      <label>Payment Date</label>
      <input type="date" id="paymentDate">

      <label>Amount</label>
      <input type="number" id="amount" placeholder="Enter Amount" oninput="updatePreview()">
      <div id="preview" class="preview"></div>

      <label>Mode</label>
      <select id="mode">
        <option>UPI</option>
        <option>Cash</option>
        <option>Bank Transfer</option>
        <option>Cheque</option>
      </select>

      <label>Reference</label>
      <input type="text" id="reference" placeholder="UPI / Transaction ID">

      <label>Remarks</label>
      <input type="text" id="remarks" placeholder="Optional">

      <button id="submitBtn" type="button" onclick="submitPayment()">Submit Payment</button>
    </div>
    <div class="card">
      <h3>System Status</h3>
      <div id="status">Ready</div>
    </div>
  </section>

  <!-- MY DUES / FLAT STATEMENT -->
  <section id="view-statement" class="view">
    <div class="card">
      <h3>My Dues &amp; Statement</h3>
      <label>Flat</label>
      <select id="stmtFlat" onchange="loadStatement()"><option>Loading...</option></select>
      <div id="stmt" class="muted">Select a flat</div>
    </div>
  </section>

  <!-- EXPENSES -->
  <section id="view-expenses" class="view">
    <div class="card">
      <h3>Expenses</h3>
      <div class="row2">
        <div>
          <label>Year</label>
          <select id="expYear" onchange="loadExpenses()"><option value="all">All</option></select>
        </div>
        <div>
          <label>Category</label>
          <select id="expCat" onchange="loadExpenses()"><option value="all">All</option></select>
        </div>
      </div>
      <div id="expBody" class="muted">Loading...</div>
    </div>
  </section>

  <!-- DEFAULTERS (committee) -->
  <section id="view-defaulters" class="view">
    <div class="card">
      <h3>Defaulters (Committee)</h3>
      <label>Committee PIN</label>
      <input type="password" id="pin" placeholder="Enter PIN" autocomplete="off">
      <button type="button" onclick="loadDefaulters()">Show Report</button>
      <div id="defBody" class="muted"></div>
    </div>
  </section>

  <!-- COLLECTION LEAD -->
  <section id="view-lead" class="view">
    <div class="card">
      <h3>Collection Lead</h3>
      <div id="leadLogin">
        <label>Your flat</label>
        <input type="text" id="leadFlat" placeholder="e.g. G1 (or COMMITTEE)" autocapitalize="characters">
        <label>PIN</label>
        <input type="password" id="leadPin" placeholder="Lead PIN" autocomplete="off">
        <button type="button" onclick="leadLogin()">Open</button>
      </div>
      <div id="leadBody"></div>
      <div id="leadForm"></div>
    </div>
  </section>

</main>

<nav id="nav">
  <button type="button" data-view="dashboard" onclick="show('dashboard')"><span>📊</span>Home</button>
  <button type="button" data-view="pay" onclick="show('pay')"><span>💳</span>Pay</button>
  <button type="button" data-view="statement" onclick="show('statement')"><span>📄</span>My Dues</button>
  <button type="button" data-view="expenses" onclick="show('expenses')"><span>🧾</span>Expenses</button>
  <button type="button" data-view="defaulters" onclick="show('defaulters')"><span>⚠️</span>Dues List</button>
  <button type="button" data-view="lead" onclick="show('lead')"><span>🤝</span>Lead</button>
</nav>

<script src="app.js?v=4"></script>
</body>
</html>
