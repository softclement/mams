<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ManaCadeo Apartment</title>
<link rel="stylesheet" href="style.css?v=11">
</head>
<body>

<header>
  <h2>🏢 ManaCadeo Apartment</h2>
  <p>Apartment Management System</p>
  <div class="topbar"><div id="who" class="who" onclick="show('account')">👤 Log in</div><button id="logoutBtn" type="button" class="logout" onclick="logoutAll()" style="display:none">Logout</button></div>
</header>

<main>

  <section id="view-dashboard" class="view">
    <div class="card">
      <h3>Dashboard <span id="dashMonth" class="muted"></span></h3>
      <div id="dashTiles">Loading...</div>
    </div>
  </section>

  <section id="view-pay" class="view">
    <div id="payGate" class="card" style="display:none"></div>
    <div id="payCard" class="card">
      <h3>Submit Payment</h3>
      <div id="editBar" class="summary" style="display:none">✏️ Editing a payment awaiting confirmation <button type="button" class="mini alt" onclick="cancelEdit()">Cancel edit</button></div>

      <label>Flat</label>
      <select id="flat" onchange="loadBalance()"><option>Loading...</option></select>

      <div id="summary" class="summary">Select a flat to see its balance</div>

      <label>Pay for</label>
      <select id="payFor" onchange="onPayFor()"></select>
      <select id="extraGroup" onchange="onPayFor()" style="display:none"></select>
      <div id="payTo" class="preview"></div>

      <label>Payment Date</label>
      <input type="date" id="paymentDate">

      <label>Amount</label>
      <input type="number" id="amount" placeholder="Enter Amount" oninput="updatePreview()">
      <div id="preview" class="preview"></div>

      <label>Mode</label>
      <select id="mode">
        <option>UPI</option>
        <option>Cash</option>
        <option>Bank Transfer</option>
        <option>Cheque</option>
      </select>

      <label>Reference *</label>
      <input type="text" id="reference" placeholder="UPI / Transaction ID (mandatory)">

      <label>Remarks</label>
      <input type="text" id="remarks" placeholder="Optional">

      <button id="submitBtn" type="button" onclick="submitPayment()">Submit Payment</button>
    </div>
    <div id="pendCard" class="card" style="display:none"></div>
    <div class="card">
      <h3>System Status</h3>
      <div id="status">Ready</div>
    </div>
  </section>

  <section id="view-reports" class="view">
    <div class="card">
      <h3>Reports</h3>
      <div id="repBody"></div>
      <div id="repBox">
        <select id="repType" onchange="repCtl()">
          <option value="dues">All flats dues</option>
          <option value="sel">Selected flats dues</option>
          <option value="ledger">Flat ledger</option>
          <option value="coll">Monthly collection ledger</option>
          <option value="exp">Monthly expense ledger</option>
          <option value="summary">Month-wise income vs expense</option>
          <option value="special">Special collections status</option>
          <option value="groups">Group fund status</option>
        </select>
        <div id="repCtl"></div>
        <button type="button" onclick="repShow()">Show</button>
        <div id="repOut"></div>
      </div>
    </div>
  </section>

  <section id="view-lead" class="view">
    <div class="card">
      <h3>Collection Lead</h3>
      <div id="leadLogin">
        <label>Your flat</label>
        <input type="text" id="leadFlat" placeholder="e.g. G1 (or ADMIN)" autocapitalize="characters" autocomplete="off">
        <label>PIN</label>
        <input type="text" id="leadPin" class="pin" placeholder="Lead PIN" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button type="button" onclick="leadLogin()">Open</button>
      </div>
      <div id="leadBody"></div>
      <div id="leadForm"></div>
    </div>
  </section>

  <section id="view-admin" class="view">
    <div class="card">
      <h3>Admin</h3>
      <div id="admBody"></div>
      <div id="admOut"></div>
    </div>
  </section>

  <section id="view-account" class="view">
    <div class="card">
      <h3>My Account</h3>
      <div id="accBody"></div>
    </div>
  </section>

</main>

<nav id="nav">
  <button type="button" data-view="dashboard" onclick="show('dashboard')"><span>📊</span>Home</button>
  <button type="button" data-view="pay" onclick="show('pay')"><span>💳</span>Pay</button>
  <button type="button" data-view="reports" onclick="show('reports')"><span>📑</span>Reports</button>
  <button type="button" data-view="lead" onclick="show('lead')"><span>🤝</span>Lead</button>
  <button type="button" data-view="admin" onclick="show('admin')"><span>⚙️</span>Admin</button>
</nav>

<script src="app.js?v=11"></script>
<script src="extra.js?v=11"></script>
</body>
</html>
