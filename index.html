<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ManaCadeo Apartment</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h2>🏢 ManaCadeo Apartment</h2>
  <p>Apartment Management System</p>
</header>

<div class="card">
  <h3>Submit Payment</h3>

  <label>Flat</label>
  <select id="flat" onchange="loadBalance()">
    <option>Loading...</option>
  </select>

  <div id="summary" class="summary">Select a flat to see its balance</div>

  <label>Payment Date</label>
  <input type="date" id="paymentDate">

  <label>Amount</label>
  <input type="number" id="amount" placeholder="Enter Amount" oninput="updatePreview()">

  <div class="quick">
    <button type="button" onclick="fillMonths(1)">1 month</button>
    <button type="button" onclick="fillMonths(3)">3 months</button>
    <button type="button" onclick="fillDues()">Clear dues</button>
  </div>
  <div id="preview" class="preview"></div>

  <label>Mode</label>
  <select id="mode">
    <option>UPI</option>
    <option>Cash</option>
    <option>Bank Transfer</option>
    <option>Cheque</option>
  </select>

  <label>Reference</label>
  <input type="text" id="reference" placeholder="UPI / Transaction ID">

  <label>Remarks</label>
  <input type="text" id="remarks" placeholder="Optional">

  <button id="submitBtn" type="button" onclick="submitPayment()">Submit Payment</button>
</div>

<div class="card">
  <h3>System Status</h3>
  <div id="status">Ready</div>
</div>

<script src="app.js?v=2"></script>
</body>
</html>
